name: Dev release

# Every push to the default branch (re)publishes a rolling pre-release on a
# dedicated `dev` tag. The tag is a moving label -- it is deleted and recreated
# at the current commit each run, so it never pins a specific version. A GitHub
# Release must be attached to a tag, hence the dummy `dev` tag.
# (release.yml still cuts real, versioned releases on real tag pushes.)
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  dev-release:
    runs-on: ubuntu-latest
    env:
      DROIDVM_PREBUILT_COMPRESSION_LEVEL: "9"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # This is a rolling DEV prerelease: always publish the debug variant,
      # even if release-signing secrets happen to be configured in the fork.
      - name: Build dev APK (debug variant)
        run: ./gradlew assembleDebug

      # Derive a version string from the latest real tag, e.g. `0.0.6.r63.52993d4`
      # (matches release.yml). The moving `dev` tag is excluded so it never
      # shadows the real version tag in `git describe`.
      - name: Get version info
        id: version
        run: |
          set -euo pipefail
          if desc="$(git describe --long --tags --exclude dev 2>/dev/null)"; then
            desc="$(echo "$desc" | sed 's/^[vV]//')"
            if echo "$desc" | grep -qE '\-0\-g[0-9a-f]+$'; then
              ver="$(echo "$desc" | sed 's/-0-g[0-9a-f]*$//')"
            else
              ver="$(echo "$desc" | sed 's/-\([0-9]*\)-g/.r\1./')"
            fi
          else
            ver="$(git rev-parse --short HEAD)"
          fi
          echo "name=${ver}" >> "$GITHUB_OUTPUT"

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p release
          apk="release/DroidVM-${{ steps.version.outputs.name }}-dev.apk"
          cp app/build/outputs/apk/debug/*.apk "$apk"

      - name: Publish rolling dev pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail

          # Drop the previous dev release + tag, then recreate at this commit so
          # `dev` always points at latest master (a moving, version-less tag).
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/dev 2>/dev/null || true

          gh release create dev "release/DroidVM-${VER}-dev.apk" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "DroidVM dev (${VER})" \
            --notes "Rolling development build from ${GITHUB_SHA} (${VER}). Not a stable release."
